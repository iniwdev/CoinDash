[alembic]
script_location = src/db/migrations
prepend_sys_path = .
version_path_separator = os
# URL is intentionally NOT set here.
# env.py reads it from src.core.config.settings (which loads .env).
# Alembic offline mode still requires a url — set DATABASE_URL in your shell:
#   $env:DATABASE_URL="postgresql+asyncpg://coindash:pass@localhost:5432/coindash"
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
