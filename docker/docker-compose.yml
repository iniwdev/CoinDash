version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: coindash_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coindash
      POSTGRES_PASSWORD: coindash_dev_password
      POSTGRES_DB: coindash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coindash"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coindash_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
